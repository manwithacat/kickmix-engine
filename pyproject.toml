[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "kickmix-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy"]
license = { text = "Apache-2.0" }

[tool.maturin]
python-source = "python"
module-name = "kickmix_engine._engine"
features = ["pyo3/extension-module"]
