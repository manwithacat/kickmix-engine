[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "kickmix-engine"
version = "0.4.0"
description = "Bit-sliced CPU simulator, per-shot compatible with kickmix, that runs the official VQCC invsqrt and DQI verifier flows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/manwithacat/kickmix-engine"
Changelog = "https://github.com/manwithacat/kickmix-engine/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kickmix-engine = "kickmix_engine.cli:main"

[tool.maturin]
python-source = "python"
module-name = "kickmix_engine._engine"
features = ["pyo3/extension-module"]
include = [{ path = "LICENSE", format = "sdist" }, { path = "NOTICE", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
